<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Periksa Transaksi - Sistem Deteksi Penipuan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="container">
        <div class="logo">Fraud Detection</div>
        <nav>
          <ul>
            <li><a href="/">Home</a></li>
            <li><a href="cek.html">Cek Transaksi</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="check-transaction-section">
        <div class="container">
          <h1>Periksa Transaksi Anda</h1>

          <!-- Tab untuk pilih mode input -->
          <div class="input-mode-tabs">
            <button type="button" class="btn-primary" onclick="showMode('pca')">Upload PCA CSV</button>
            <button type="button" class="btn-primary" onclick="showMode('raw')">Upload Raw CSV</button>
            <button type="button" class="btn-primary" onclick="showMode('manual')">Manual Input</button>
          </div>

          <!-- Mode A: Upload PCA CSV -->
          <div id="mode-pca" class="input-content">
            <h2>Unggah Data (PCA CSV)</h2>
            <form id="formPcaCsv" class="csv-upload-form">
              <input type="file" name="file" accept=".csv" required />
              <button type="submit" class="btn-primary">Prediksi</button>
            </form>
          </div>

          <!-- Mode B: Upload Raw CSV -->
          <div id="mode-raw" class="input-content hidden">
            <h2>Unggah Data (Raw CSV)</h2>
            <form id="formRawCsv" class="csv-upload-form">
              <input type="file" name="file" accept=".csv" required />
              <button type="submit" class="btn-primary">Prediksi</button>
            </form>
          </div>

        <!-- Mode C: Manual Input -->
        <div id="mode-manual" class="input-content hidden">
          <h2>Input Manual</h2>

          <form id="formManual" class="manual-form">

            <label>Transaction ID</label>
            <input type="number" name="TransactionID" required />

            <label>Tanggal</label>
            <input type="date" name="Tanggal" required />

            <label>Time</label>
            <input type="text" id="timeInput" name="Time" placeholder="19.07" required />

            <label>Merchant</label>
            <select name="Merchant" required>
              <option value="">Pilih Merchant</option>
              <option value="Shopee">Shopee</option>
              <option value="Tokopedia">Tokopedia</option>
              <option value="GoPay">GoPay</option>
              <option value="Traveloka">Traveloka</option>
              <option value="OVO">OVO</option>
              <option value="Dana">Dana</option>
            </select>

            <label>City</label>
            <select name="City" required>
              <option value="">Pilih Kota</option>
              <option value="Jakarta">Jakarta</option>
              <option value="Bandung">Bandung</option>
              <option value="Surabaya">Surabaya</option>
              <option value="Semarang">Semarang</option>
            </select>

            <label>Amount</label>
            <input type="text" id="amountInput" name="Amount" placeholder="1.900.000" required />

            <button type="submit" class="btn-primary">Prediksi</button>

          </form>
        </div>

          <p id="loadingMessage" style="display: none">Memuat prediksi...</p>
          <p id="errorMessage" style="display: none">Terjadi kesalahan: Ada yang tidak beres.</p>

          <div id="resultsSection" class="results-section hidden">
            <h2>Hasil Prediksi</h2>
            <div id="predictionResultsContainer"></div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2025 Sistem Deteksi Penipuan. Semua hak dilindungi undang-undang.</p>
      </div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
